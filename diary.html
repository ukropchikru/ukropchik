<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дневник питания — Укропчик</title>
  <meta name="description" content="Записывайте, что съели за день, и сравнивайте с нормой калорий и БЖУ.">
  <meta name="theme-color" content="#2d5f3b">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Укропчик">
  <script src="js/theme.js"></script>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/db.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/recipes-data.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/plan.js"></script>
  <script defer src="js/diary.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>Дневник питания</h1>
        <p>Отмечайте, что съели, и сравнивайте с дневной нормой. Норма берётся из <a href="calculator.html">калькулятора</a>.</p>
      </div>
    </section>

    <section class="container" style="padding-bottom:64px">
      <div class="date-nav">
        <button class="btn btn-ghost btn-sm" type="button" id="prev-day" aria-label="Предыдущий день">←</button>
        <label class="sr-only" for="date">Дата</label>
        <input class="input" type="date" id="date">
        <button class="btn btn-ghost btn-sm" type="button" id="next-day" aria-label="Следующий день">→</button>
        <button class="btn btn-ghost btn-sm" type="button" id="today">Сегодня</button>
      </div>
      <p class="form-note hidden" id="guest-note" style="max-width:760px;margin:0 auto 24px;text-align:center"></p>

      <div class="diet-layout">
        <div class="meals" id="meals"><p class="muted">Загрузка…</p></div>

        <aside class="summary">
          <div class="card">
            <h3 id="sum-title">Итог за день</h3>
            <div class="kcal-big"><span id="sum-kcal">0</span> <small>/ <span id="sum-target">2000</span> ккал</small></div>
            <div class="progress" id="sum-progress"><div style="width:0"></div></div>
            <p class="small muted" id="sum-hint"></p>
            <div class="macro-bars" id="macros"></div>

            <h3 style="margin-bottom:0">Последние 7 дней</h3>
            <div class="week-chart" id="week-chart"></div>

            <button class="btn btn-ghost btn-block" type="button" id="from-plan" style="margin-top:12px">Перенести меню из конструктора</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
