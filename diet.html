<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструктор рациона — Укропчик</title>
  <meta name="description" content="Соберите сбалансированное меню на день или неделю под свою норму калорий и цели.">
  <meta name="theme-color" content="#2d5f3b">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Укропчик">
  <script src="js/theme.js"></script>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/db.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/recipes-data.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/plan.js"></script>
  <script defer src="js/diet.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>Конструктор рациона</h1>
        <p>Соберите сбалансированное меню на день или неделю. Норму калорий можно посчитать в <a href="calculator.html">калькуляторе</a>.</p>
      </div>
    </section>

    <section class="container" style="padding-bottom:64px">
      <div class="diet-layout">
        <div>
          <div class="card" style="margin-bottom:24px">
            <div class="diet-toolbar">
              <div class="field">
                <label for="target">Норма, ккал/день</label>
                <input class="input" id="target" type="number" inputmode="numeric" min="1000" max="6000" step="10">
              </div>
              <div class="field">
                <label for="goal">Цель</label>
                <select class="select" id="goal">
                  <option value="lose">Похудеть</option>
                  <option value="maintain">Поддерживать вес</option>
                  <option value="gain">Набрать массу</option>
                </select>
              </div>
              <div class="field" style="flex:0 0 auto">
                <span class="label">Период</span>
                <div class="segmented" id="mode">
                  <button type="button" data-mode="day">День</button>
                  <button type="button" data-mode="week">Неделя</button>
                </div>
              </div>
            </div>
            <div class="diet-actions">
              <button class="btn btn-lime" type="button" id="auto-btn">✨ Подобрать автоматически</button>
              <button class="btn btn-ghost hidden" type="button" id="copy-btn">Скопировать день на всю неделю</button>
              <button class="btn btn-ghost" type="button" id="clear-btn">Очистить</button>
              <a class="btn btn-ghost" href="shopping.html">🛒 Список покупок</a>
              <a class="btn btn-ghost" href="diary.html#from-plan">📔 В дневник</a>
              <button class="btn btn-ghost" type="button" id="print-btn">🖨 Распечатать</button>
            </div>
            <div class="day-tabs hidden" id="day-tabs" role="tablist" aria-label="Дни недели"></div>
          </div>

          <div class="meals" id="meals"></div>
        </div>

        <aside class="summary">
          <div class="card">
            <h3 id="sum-title">Итог за день</h3>
            <div class="kcal-big"><span id="sum-kcal">0</span> <small>/ <span id="sum-target">2000</span> ккал</small></div>
            <div class="progress" id="sum-progress"><div style="width:0"></div></div>
            <p class="small muted" id="sum-hint"></p>

            <div class="donut-wrap">
              <div class="donut" id="donut" role="img" aria-label="Соотношение белков, жиров и углеводов"></div>
              <ul class="legend" id="legend"></ul>
            </div>

            <div id="week-box" class="hidden">
              <h3 style="margin-bottom:0">Калории по дням</h3>
              <div class="week-chart" id="week-chart"></div>
            </div>

            <div class="no-print" style="border-top:1px dashed var(--field-line);padding-top:20px;margin-top:8px">
              <h3>Сохранить рацион</h3>
              <form id="save-form" style="display:grid;gap:10px" novalidate>
                <label class="sr-only" for="save-title">Название</label>
                <input class="input" id="save-title" maxlength="120" placeholder="Например: Меню на неделю — похудение">
                <button class="btn btn-primary btn-block" type="submit">Сохранить в аккаунт</button>
              </form>
              <div id="saved-box" style="margin-top:20px"></div>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
