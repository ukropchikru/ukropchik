<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список покупок — Укропчик</title>
  <meta name="description" content="Список покупок, собранный автоматически из вашего рациона на день или неделю.">
  <meta name="theme-color" content="#2d5f3b">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Укропчик">
  <script src="js/theme.js"></script>
  <link rel="preload" href="fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/vendor/supabase.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/db.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/recipes-data.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/plan.js"></script>
  <script defer src="js/shopping.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>Список покупок</h1>
        <p>Собран автоматически из вашего <a href="diet.html">рациона</a>. Готовые блюда пересчитаны в продукты: например, отварная гречка — в сухую крупу.</p>
      </div>
    </section>

    <section class="container" style="padding-bottom:64px;max-width:760px">
      <div class="card">
        <div class="diet-actions no-print">
          <button class="btn btn-ghost" type="button" id="copy">📋 Скопировать</button>
          <button class="btn btn-ghost hidden" type="button" id="share">📤 Поделиться</button>
          <button class="btn btn-ghost" type="button" id="print">🖨 Распечатать</button>
          <button class="btn btn-ghost" type="button" id="reset">Снять отметки</button>
        </div>
        <p class="muted" id="shop-info"></p>
        <div id="shop"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
